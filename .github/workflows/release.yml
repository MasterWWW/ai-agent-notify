name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            bundles: "app,dmg"
          - os: windows-latest
            platform: windows
            bundles: "msi,nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        # 本地 tauri.conf.json 只打 .app（create-dmg 在部分机器不稳定）；
        # CI 环境干净，这里通过 --bundles 覆盖，直接产出 dmg / msi / nsis。
        run: pnpm --filter ai-task-notify-desktop tauri build --bundles ${{ matrix.bundles }}
        env:
          CI: true

      - name: Collect installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          # Cargo workspace 的 target 在仓库根目录，不是 src-tauri/target
          BUNDLE_ROOT=""
          for candidate in target/release/bundle desktop/src-tauri/target/release/bundle; do
            if [ -d "$candidate" ]; then
              BUNDLE_ROOT="$candidate"
              break
            fi
          done

          if [ -z "$BUNDLE_ROOT" ]; then
            echo "bundle directory not found. Searching..."
            find . -type d -path '*/release/bundle' 2>/dev/null | head -20 || true
            ls -la target/release 2>/dev/null || true
            exit 1
          fi

          echo "Using bundle root: $BUNDLE_ROOT"
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.app.tar.gz' \) \
            -exec cp {} release-artifacts/ \;
          echo "Collected files:"
          ls -la release-artifacts/
          test "$(ls -1 release-artifacts | wc -l)" -gt 0

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-task-notify-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
