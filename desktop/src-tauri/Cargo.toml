[package]
name = "ai-task-notify-desktop"
version = "0.1.0"
description = "AI Task Notify menu bar app (Tauri + React, Rust server embedded)"
edition = "2021"

[lib]
name = "ai_task_notify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ai-task-notify-server = { path = "../../server-rs" }
arboard = "3"
open = "5"

[profile.release]
strip = true
lto = true
